external_components:
  - source: github://hryamzik/esphome-weather-station@main
    components: [weather_station]

remote_receiver:
  id: rf_receiver
  pin:
    number: GPIO3
    mode:
      input: true
      pullup: false
  tolerance: 50%
  filter: 250us
  idle: 4ms

weather_station:
  receiver_id: rf_receiver
  protocols:
    - oregon2
  stations:
    - id: garden
      name: Garden
      primary: true
      selector:
        protocol: oregon2
        model: 0x1D20
        channel: 1
      temperature:
        name: Garden Temperature
      humidity:
        name: Garden Humidity
      channel:
        name: Garden Channel
      rolling_code:
        name: Garden Rolling Code
      battery_low:
        name: Garden Battery Low
      age:
        name: Garden Station Age
    - id: greenhouse
      name: Greenhouse
      selector:
        protocol: oregon2
        model: 0x1D20
        channel: 2
        rolling_code: 0x42
      temperature:
        name: Greenhouse Temperature
      humidity:
        name: Greenhouse Humidity
  ignore:
    - protocol: oregon2
      model: 0x1D20
      channel: 3
  diagnostics:
    last_unknown_selector:
      name: Last Unknown Weather Station
    recent_unknown_count:
      name: Recent Unknown Weather Stations
    unknown_window: 5min
